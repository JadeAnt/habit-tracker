<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Habit Tracker (Local)</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap');

  :root{
    --paper: #F7F6F2;
    --paper-raised: #FFFFFF;
    --ink: #1C1C1A;
    --ink-soft: #6B6A64;
    --line: #E4E2DA;

    --lvl0: #EBEFE6;
    --lvl1: #B9D6A6;
    --lvl2: #7FB868;
    --lvl3: #4A8A3A;
    --lvl4: #245026;

    --amber: #C1702F;
    --amber-soft: #F3E1D2;
    --red-soft: #C1502F;
  }

  *{ box-sizing: border-box; }
  body{
    margin:0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    padding: 40px 20px 80px;
  }

  .wrap{ max-width: 780px; margin: 0 auto; }

  .top{
    display:flex;
    justify-content: space-between;
    align-items: flex-end;
    margin-bottom: 32px;
    gap: 16px;
    flex-wrap: wrap;
  }
  .brand{
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--ink-soft);
    font-weight: 600;
    margin-bottom: 6px;
  }
  h1{
    margin:0;
    font-size: 28px;
    font-weight: 700;
    letter-spacing: -0.01em;
  }
  .add-btn{
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    background: var(--ink);
    color: var(--paper);
    border: none;
    padding: 10px 16px;
    border-radius: 6px;
    cursor: pointer;
  }
  .add-btn:hover{ opacity: 0.85; }

  .add-form{
    display:flex;
    gap: 8px;
    margin-bottom: 28px;
  }
  .add-form input{
    flex: 1;
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--paper-raised);
    color: var(--ink);
  }
  .add-form input:focus{ outline: 2px solid var(--amber); outline-offset: -1px; }
  .add-form button{
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    border: none;
    border-radius: 6px;
    padding: 10px 16px;
    cursor: pointer;
  }
  .add-form .confirm{ background: var(--amber); color: #fff; }
  .add-form .cancel{ background: var(--line); color: var(--ink-soft); }

  .tabs{
    display:flex;
    gap: 6px;
    margin-bottom: 28px;
    border-bottom: 1px solid var(--line);
    flex-wrap: wrap;
  }
  .tab{
    font-size: 14px;
    font-weight: 500;
    padding: 10px 4px;
    margin-right: 18px;
    color: var(--ink-soft);
    cursor: pointer;
    border-bottom: 2px solid transparent;
    position: relative;
    top: 1px;
    user-select: none;
  }
  .tab.active{
    color: var(--ink);
    border-bottom-color: var(--amber);
  }
  .tab.all-tab{ margin-left: auto; margin-right: 0; }

  .card{
    background: var(--paper-raised);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 28px 28px 22px;
  }

  .card-head{
    display:flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 16px;
    margin-bottom: 24px;
    flex-wrap: wrap;
  }

  .stats{ display:flex; gap: 32px; flex-wrap: wrap; }
  .stat .num{
    font-family: 'JetBrains Mono', monospace;
    font-size: 26px;
    font-weight: 700;
    line-height: 1;
  }
  .stat .num.amber{ color: var(--amber); }
  .stat .label{
    font-size: 12px;
    color: var(--ink-soft);
    margin-top: 6px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }

  .mark-btn{
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    font-weight: 500;
    background: var(--amber);
    color: #fff;
    border: none;
    padding: 11px 18px;
    border-radius: 6px;
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.15s ease, transform 0.1s ease;
  }
  .mark-btn:hover{ transform: translateY(-1px); }
  .mark-btn.done{ background: var(--amber-soft); color: var(--amber); }

  .grid-scroll{ overflow-x: auto; padding-bottom: 4px; }
  .grid-area{ display:flex; gap: 8px; }
  .day-labels{
    display:flex;
    flex-direction: column;
    gap: 3px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--ink-soft);
    padding-top: 16px;
  }
  .day-labels div{ height: 13px; line-height: 13px; }

  .months-and-grid{ display:flex; flex-direction: column; }
  .month-labels{
    display:flex;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--ink-soft);
    margin-bottom: 4px;
    height: 12px;
    position: relative;
  }
  .month-labels span{ position: absolute; }

  .weeks{ display:flex; gap: 3px; }
  .week{ display:flex; flex-direction: column; gap: 3px; }
  .day{
    width: 10px;
    height: 10px;
    border-radius: 2px;
    background: var(--lvl0);
    transition: transform 0.12s ease;
  }
  .day.l1{ background: var(--lvl1); }
  .day.l2{ background: var(--lvl2); }
  .day.l3{ background: var(--lvl3); }
  .day.l4{ background: var(--lvl4); }
  .day.today{ outline: 1.5px solid var(--amber); outline-offset: 1px; }
  .day.clickable:hover{ transform: scale(1.4); cursor: pointer; }
  .day.future{ opacity: 0.35; }

  .legend{
    display:flex;
    align-items:center;
    gap:6px;
    margin-top: 18px;
    font-size: 11px;
    color: var(--ink-soft);
    font-family: 'JetBrains Mono', monospace;
  }
  .legend .day{ width:10px; height:10px; }

  .card-foot{
    margin-top: 20px;
    padding-top: 14px;
    border-top: 1px dashed var(--line);
    display:flex;
    justify-content: flex-end;
  }
  .remove-link{
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--ink-soft);
    background: none;
    border: none;
    cursor: pointer;
    text-decoration: underline;
    text-underline-offset: 2px;
  }
  .remove-link:hover{ color: var(--red-soft); }

  #allView{ display:none; }
  .mini-card{
    background: var(--paper-raised);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 20px 24px;
    margin-bottom: 14px;
  }
  .mini-head{
    display:flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
    flex-wrap: wrap;
    gap: 8px;
  }
  .mini-title{ font-size: 15px; font-weight: 600; }
  .mini-title .streak{
    font-family: 'JetBrains Mono', monospace;
    font-weight: 500;
    color: var(--amber);
    font-size: 12px;
    margin-left: 8px;
  }
  .mini-mark{
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    font-weight: 500;
    background: var(--amber);
    color: #fff;
    border: none;
    padding: 6px 12px;
    border-radius: 5px;
    cursor: pointer;
  }
  .mini-mark.done{ background: var(--amber-soft); color: var(--amber); }
  .mini-weeks{ display:flex; gap: 2px; overflow-x: auto; }
  .mini-week{ display:flex; flex-direction: column; gap: 2px; }
  .mini-day{
    width: 7px;
    height: 7px;
    border-radius: 1.5px;
    background: var(--lvl0);
    flex-shrink: 0;
  }
  .mini-day.l1{ background: var(--lvl1); }
  .mini-day.l2{ background: var(--lvl2); }
  .mini-day.l3{ background: var(--lvl3); }
  .mini-day.l4{ background: var(--lvl4); }
  .mini-day.today{ outline: 1px solid var(--amber); outline-offset: 0.5px; }

  .empty-state{
    text-align: center;
    padding: 60px 20px;
    color: var(--ink-soft);
  }
  .empty-state .big{
    font-size: 15px;
    color: var(--ink);
    margin-bottom: 6px;
    font-weight: 500;
  }
  .empty-state .small{ font-size: 13px; }

  .toast{
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(0);
    background: var(--ink);
    color: var(--paper);
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    padding: 10px 16px;
    border-radius: 6px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease, transform 0.2s ease;
  }
  .toast.show{ opacity: 1; transform: translateX(-50%) translateY(-4px); }

  .loading{
    text-align: center;
    padding: 80px 20px;
    color: var(--ink-soft);
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="top">
    <div>
      <div class="brand">Habit Tracker</div>
      <h1>Your streaks</h1>
    </div>
    <button class="add-btn" id="addBtn">+ add habit</button>
  </div>

  <div class="add-form" id="addForm" style="display:none;">
    <input type="text" id="addInput" placeholder="Habit name, e.g. Read" maxlength="40">
    <button class="confirm" id="addConfirm">Add</button>
    <button class="cancel" id="addCancel">Cancel</button>
  </div>

  <div id="app">
    <div class="loading">Loading your habits…</div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  const dayMs = 86400000;
  const app = document.getElementById('app');
  const toast = document.getElementById('toast');

  let habits = [];          // [{id, name}]
  let checkinsByHabit = {}; // { habitId: Set of 'YYYY-MM-DD' }
  let activeHabitId = null; // null means loading/none; '__all__' means all-view

  // ---------- storage helpers (browser localStorage) ----------
  const STORAGE_PREFIX = 'habitTracker:';

  function loadHabits(){
    try{
      const raw = localStorage.getItem(STORAGE_PREFIX + 'habits');
      return raw ? JSON.parse(raw) : [];
    }catch(e){
      return [];
    }
  }
  function saveHabits(list){
    try{
      localStorage.setItem(STORAGE_PREFIX + 'habits', JSON.stringify(list));
    }catch(e){
      showToast('Could not save — storage may be full or disabled');
    }
  }
  function loadCheckins(habitId){
    try{
      const raw = localStorage.getItem(STORAGE_PREFIX + 'checkins:' + habitId);
      return raw ? new Set(JSON.parse(raw)) : new Set();
    }catch(e){
      return new Set();
    }
  }
  function saveCheckins(habitId, set){
    try{
      localStorage.setItem(STORAGE_PREFIX + 'checkins:' + habitId, JSON.stringify(Array.from(set)));
    }catch(e){
      showToast('Could not save — storage may be full or disabled');
    }
  }
  function deleteCheckins(habitId){
    try{ localStorage.removeItem(STORAGE_PREFIX + 'checkins:' + habitId); }catch(e){ /* ignore */ }
  }

  function showToast(msg){
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 1800);
  }

  // ---------- date helpers ----------
  function fmt(d){
    const y = d.getFullYear();
    const m = String(d.getMonth()+1).padStart(2,'0');
    const day = String(d.getDate()).padStart(2,'0');
    return `${y}-${m}-${day}`;
  }
  function startOfToday(){
    const d = new Date();
    d.setHours(0,0,0,0);
    return d;
  }

  // ---------- stats ----------
  function computeStats(doneSet){
    const today = startOfToday();
    let cur = 0;
    let cursor = new Date(today);
    if(!doneSet.has(fmt(cursor))){
      cursor = new Date(cursor.getTime() - dayMs);
    }
    while(doneSet.has(fmt(cursor))){
      cur++;
      cursor = new Date(cursor.getTime() - dayMs);
    }

    const allDates = Array.from(doneSet).sort();
    let longest = 0, run = 0, prev = null;
    for(const ds of allDates){
      const d = new Date(ds + 'T00:00:00');
      if(prev && (d - prev) === dayMs){
        run++;
      } else {
        run = 1;
      }
      longest = Math.max(longest, run);
      prev = d;
    }

    const total = doneSet.size;

    let doneIn90 = 0;
    for(let i=0;i<90;i++){
      const d = new Date(today.getTime() - i*dayMs);
      if(doneSet.has(fmt(d))) doneIn90++;
    }
    const pct90 = Math.round((doneIn90/90)*100);

    return { current: cur, longest, total, pct90 };
  }

  function levelForDate(doneSet, date){
    if(!doneSet.has(fmt(date))) return 0;
    let run = 0;
    let c = new Date(date);
    while(doneSet.has(fmt(c))){
      run++;
      c = new Date(c.getTime() - dayMs);
    }
    if(run >= 14) return 4;
    if(run >= 7) return 3;
    if(run >= 3) return 2;
    return 1;
  }

  // ---------- grid building ----------
  function buildGrid({ weeksEl, monthLabelsEl, numWeeks, doneSet, squareClass, dayClassPrefix, clickable, cellSpan, onToggle }){
    weeksEl.innerHTML = '';
    if(monthLabelsEl) monthLabelsEl.innerHTML = '';
    const today = startOfToday();
    const endDate = new Date(today);
    const startDate = new Date(endDate.getTime() - (numWeeks*7 - 1) * dayMs);
    startDate.setTime(startDate.getTime() - startDate.getDay()*dayMs);

    let lastMonth = -1;
    let cursor = new Date(startDate);

    for(let w=0; w<numWeeks; w++){
      const weekDiv = document.createElement('div');
      weekDiv.className = squareClass === 'day' ? 'week' : 'mini-week';

      if(monthLabelsEl && cursor.getMonth() !== lastMonth){
        const label = document.createElement('span');
        label.style.left = (w*cellSpan) + 'px';
        label.textContent = cursor.toLocaleString('en-US', {month:'short'});
        monthLabelsEl.appendChild(label);
        lastMonth = cursor.getMonth();
      }

      for(let d=0; d<7; d++){
        const dayDiv = document.createElement('div');
        const thisDate = new Date(cursor);
        const isFuture = thisDate > endDate;
        const level = isFuture ? 0 : levelForDate(doneSet, thisDate);
        dayDiv.className = dayClassPrefix + (level ? ' l'+level : '');
        if(thisDate.toDateString() === today.toDateString()) dayDiv.classList.add('today');
        if(isFuture) dayDiv.classList.add('future');
        dayDiv.title = thisDate.toDateString() + (isFuture ? '' : (doneSet.has(fmt(thisDate)) ? ' — done' : ' — not done'));
        if(clickable && !isFuture){
          dayDiv.classList.add('clickable');
          dayDiv.addEventListener('click', () => onToggle(thisDate));
        }
        weekDiv.appendChild(dayDiv);
        cursor = new Date(cursor.getTime() + dayMs);
      }
      weeksEl.appendChild(weekDiv);
    }
  }

  // ---------- toggle logic ----------
  function toggleDate(habitId, date){
    const set = checkinsByHabit[habitId];
    const key = fmt(date);
    if(set.has(key)) set.delete(key); else set.add(key);
    saveCheckins(habitId, set);
    render();
  }

  // ---------- rendering ----------
  function render(){
    if(habits.length === 0){
      app.innerHTML = `
        <div class="empty-state">
          <div class="big">No habits yet</div>
          <div class="small">Click "+ add habit" above to start your first streak.</div>
        </div>`;
      return;
    }

    if(!activeHabitId || (activeHabitId !== '__all__' && !habits.find(h => h.id === activeHabitId))){
      activeHabitId = habits[0].id;
    }

    const tabsHtml = habits.map(h =>
      `<div class="tab ${h.id===activeHabitId ? 'active':''}" data-id="${h.id}">${escapeHtml(h.name)}</div>`
    ).join('') + `<div class="tab all-tab ${activeHabitId==='__all__' ? 'active':''}" data-id="__all__">All habits</div>`;

    app.innerHTML = `
      <div class="tabs" id="tabsRow">${tabsHtml}</div>
      <div id="singleView"></div>
      <div id="allView"></div>
    `;

    document.querySelectorAll('#tabsRow .tab').forEach(tab => {
      tab.addEventListener('click', () => {
        activeHabitId = tab.dataset.id;
        render();
      });
    });

    const singleView = document.getElementById('singleView');
    const allView = document.getElementById('allView');

    if(activeHabitId === '__all__'){
      singleView.style.display = 'none';
      allView.style.display = 'block';
      renderAllView(allView);
    } else {
      singleView.style.display = 'block';
      allView.style.display = 'none';
      renderSingleView(singleView, activeHabitId);
    }
  }

  function renderSingleView(container, habitId){
    const habit = habits.find(h => h.id === habitId);
    const doneSet = checkinsByHabit[habitId];
    const stats = computeStats(doneSet);
    const todayKey = fmt(startOfToday());
    const doneToday = doneSet.has(todayKey);

    container.innerHTML = `
      <div class="card">
        <div class="card-head">
          <div class="stats">
            <div class="stat"><div class="num amber">${stats.current}</div><div class="label">Current streak</div></div>
            <div class="stat"><div class="num">${stats.longest}</div><div class="label">Longest streak</div></div>
            <div class="stat"><div class="num">${stats.total}</div><div class="label">Total days</div></div>
            <div class="stat"><div class="num">${stats.pct90}%</div><div class="label">Last 90 days</div></div>
          </div>
          <button class="mark-btn ${doneToday?'done':''}" id="markBtn">${doneToday ? '✓ Done today' : 'Mark today done'}</button>
        </div>

        <div class="grid-scroll">
          <div class="grid-area">
            <div class="day-labels"><div></div><div>Mon</div><div></div><div>Wed</div><div></div><div>Fri</div><div></div></div>
            <div class="months-and-grid">
              <div class="month-labels" id="monthLabels"></div>
              <div class="weeks" id="weeks"></div>
            </div>
          </div>
        </div>

        <div class="legend">
          <span>Less</span>
          <div class="day"></div><div class="day l1"></div><div class="day l2"></div><div class="day l3"></div><div class="day l4"></div>
          <span>More</span>
        </div>

        <div class="card-foot">
          <button class="remove-link" id="removeBtn">Remove "${escapeHtml(habit.name)}"</button>
        </div>
      </div>
    `;

    buildGrid({
      weeksEl: document.getElementById('weeks'),
      monthLabelsEl: document.getElementById('monthLabels'),
      numWeeks: 53,
      doneSet: doneSet,
      squareClass: 'day',
      dayClassPrefix: 'day',
      clickable: true,
      cellSpan: 13,
      onToggle: (date) => toggleDate(habitId, date)
    });

    document.getElementById('markBtn').addEventListener('click', () => {
      toggleDate(habitId, startOfToday());
    });

    document.getElementById('removeBtn').addEventListener('click', () => {
      if(!confirm(`Remove "${habit.name}" and all its history? This can't be undone.`)) return;
      habits = habits.filter(h => h.id !== habitId);
      delete checkinsByHabit[habitId];
      saveHabits(habits);
      deleteCheckins(habitId);
      activeHabitId = habits.length ? habits[0].id : null;
      render();
      showToast('Habit removed');
    });
  }

  function renderAllView(container){
    container.innerHTML = '';
    habits.forEach((habit, i) => {
      const doneSet = checkinsByHabit[habit.id];
      const stats = computeStats(doneSet);
      const todayKey = fmt(startOfToday());
      const doneToday = doneSet.has(todayKey);

      const card = document.createElement('div');
      card.className = 'mini-card';
      card.innerHTML = `
        <div class="mini-head">
          <div class="mini-title">${escapeHtml(habit.name)} <span class="streak">${stats.current}-day streak</span></div>
          <button class="mini-mark ${doneToday?'done':''}" data-id="${habit.id}">${doneToday ? '✓ Done' : 'Mark done'}</button>
        </div>
        <div class="mini-weeks" id="miniWeeks-${i}"></div>
      `;
      container.appendChild(card);
      buildGrid({
        weeksEl: document.getElementById(`miniWeeks-${i}`),
        monthLabelsEl: null,
        numWeeks: 40,
        doneSet: doneSet,
        squareClass: 'mini',
        dayClassPrefix: 'mini-day',
        clickable: false,
        cellSpan: 9
      });
    });

    container.querySelectorAll('.mini-mark').forEach(btn => {
      btn.addEventListener('click', () => toggleDate(btn.dataset.id, startOfToday()));
    });
  }

  function escapeHtml(s){
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  // ---------- add habit flow ----------
  const addBtn = document.getElementById('addBtn');
  const addForm = document.getElementById('addForm');
  const addInput = document.getElementById('addInput');
  const addConfirm = document.getElementById('addConfirm');
  const addCancel = document.getElementById('addCancel');

  addBtn.addEventListener('click', () => {
    addForm.style.display = 'flex';
    addInput.value = '';
    addInput.focus();
  });
  addCancel.addEventListener('click', () => { addForm.style.display = 'none'; });
  addInput.addEventListener('keydown', (e) => {
    if(e.key === 'Enter') addConfirm.click();
    if(e.key === 'Escape') addCancel.click();
  });
  addConfirm.addEventListener('click', () => {
    const name = addInput.value.trim();
    if(!name) return;
    const id = 'h_' + Date.now().toString(36) + Math.random().toString(36).slice(2,8);
    habits.push({ id, name });
    checkinsByHabit[id] = new Set();
    saveHabits(habits);
    activeHabitId = id;
    addForm.style.display = 'none';
    render();
    showToast('Habit added');
  });

  // ---------- init ----------
  (function init(){
    habits = loadHabits();
    for(const h of habits){
      checkinsByHabit[h.id] = loadCheckins(h.id);
    }
    if(habits.length) activeHabitId = habits[0].id;
    render();
  })();
})();
</script>
</body>
</html>
